# =========================================================================
# Phase 2: MPI_Bcast Comparison on Fat-Tree Topologies
# =========================================================================
# Configurations:
#   Naive_4, Opt_4, Naive_8, Opt_8, Naive_16, Opt_16, Naive_32, Opt_32
#   Plus payload size variants: _256B, _4096B suffixes
# =========================================================================

[General]
sim-time-limit = 100s  # safety net only; simulation ends naturally when all messages are delivered
cmdenv-express-mode = true
ned-path = ../src;.

# Tier-aware link delays (fiber ~5 ns/m propagation)
**.hostEdgeDelay = 5ns
**.edgeAggDelay  = 100ns
**.aggCoreDelay  = 500ns
**.coreCoreDelay = 1us
**.linkDatarate  = 1Gbps

# Switch processing delay
**.processingDelay = 200ns

# Default payload
**.payloadSize = 1024

# Per-message send interval (models CPU/NIC processing cost per message)
# This is what makes D&C outperform naive: root in naive must send N-1
# messages sequentially, while D&C distributes sending across multiple hosts.
**.sendInterval = 0.002s

# =========================================================================
# FatTree4: 4 hosts, 2 edge switches, 1 core switch
# =========================================================================
# Gate assignments:
#   edge[0]: port[0]=host[0], port[1]=host[1], port[2]=core
#   edge[1]: port[0]=host[2], port[1]=host[3], port[2]=core
#   core:    port[0]=edge[0], port[1]=edge[1]

[Config Naive_4]
network = FatTree4
**.algorithmMode = 0

# Routing tables
**.edge[0].routingTable = "0:0,1:1,2:2,3:2"
**.edge[1].routingTable = "0:2,1:2,2:0,3:1"
**.core.routingTable = "0:0,1:0,2:1,3:1"

[Config Opt_4]
network = FatTree4
**.algorithmMode = 1

# Same routing tables
**.edge[0].routingTable = "0:0,1:1,2:2,3:2"
**.edge[1].routingTable = "0:2,1:2,2:0,3:1"
**.core.routingTable = "0:0,1:0,2:1,3:1"

# =========================================================================
# FatTree8: 8 hosts, 4 edge, 2 agg, 1 core
# =========================================================================
# Gate assignments:
#   edge[0]: port[0]=host[0], port[1]=host[1], port[2]=agg[0]
#   edge[1]: port[0]=host[2], port[1]=host[3], port[2]=agg[0]
#   edge[2]: port[0]=host[4], port[1]=host[5], port[2]=agg[1]
#   edge[3]: port[0]=host[6], port[1]=host[7], port[2]=agg[1]
#   agg[0]:  port[0]=edge[0], port[1]=edge[1], port[2]=core
#   agg[1]:  port[0]=edge[2], port[1]=edge[3], port[2]=core
#   core:    port[0]=agg[0], port[1]=agg[1]

[Config Naive_8]
network = FatTree8
**.algorithmMode = 0

**.edge[0].routingTable = "0:0,1:1,2:2,3:2,4:2,5:2,6:2,7:2"
**.edge[1].routingTable = "0:2,1:2,2:0,3:1,4:2,5:2,6:2,7:2"
