**.agg[0].routingTable = "0:0,1:0,2:1,3:1,4:2,5:2,6:2,7:2"
**.agg[1].routingTable = "0:2,1:2,2:2,3:2,4:0,5:0,6:1,7:1"
**.core.routingTable = "0:0,1:0,2:0,3:0,4:1,5:1,6:1,7:1"

[Config Opt_8]
network = FatTree8
**.algorithmMode = 1

**.edge[0].routingTable = "0:0,1:1,2:2,3:2,4:2,5:2,6:2,7:2"
**.edge[1].routingTable = "0:2,1:2,2:0,3:1,4:2,5:2,6:2,7:2"
**.edge[2].routingTable = "0:2,1:2,2:2,3:2,4:0,5:1,6:2,7:2"
**.edge[3].routingTable = "0:2,1:2,2:2,3:2,4:2,5:2,6:0,7:1"
**.agg[0].routingTable = "0:0,1:0,2:1,3:1,4:2,5:2,6:2,7:2"
**.agg[1].routingTable = "0:2,1:2,2:2,3:2,4:0,5:0,6:1,7:1"
**.core.routingTable = "0:0,1:0,2:0,3:0,4:1,5:1,6:1,7:1"

